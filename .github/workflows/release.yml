name: Build and Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-linux:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v3

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build build-essential libgit2-dev libssl-dev libgl1-mesa-dev

      - name: Install Qt
        uses: jurplel/install-qt-action@v3
        with:
          version: '6.5.3'
          host: 'linux'
          target: 'desktop'

      - name: Build LoopGit
        run: |
          mkdir build && cd build
          cmake -G Ninja -DCMAKE_BUILD_TYPE=Release ..
          cmake --build .

      - name: Download linuxdeploy
        run: |
          wget https://github.com/linuxdeploy/linuxdeploy/releases/download/continuous/linuxdeploy-x86_64.AppImage
          wget https://github.com/linuxdeploy/linuxdeploy-plugin-qt/releases/download/continuous/linuxdeploy-plugin-qt-x86_64.AppImage
          chmod +x linuxdeploy-x86_64.AppImage linuxdeploy-plugin-qt-x86_64.AppImage

      - name: Setup AppDir and build AppImage
        env:
          VERSION: ${{ github.ref_name }}
          EXTRA_QT_PLUGINS: "svg"
        run: |
          mkdir -p AppDir/usr/bin
          mkdir -p AppDir/usr/share/applications
          mkdir -p AppDir/usr/share/icons/hicolor/256x256/apps
          
          # Copy the executable
          cp build/LoopGit AppDir/usr/bin/
          
          # Create a basic desktop file
          cat <<EOF > AppDir/usr/share/applications/loopgit.desktop
          [Desktop Entry]
          Name=LoopGit
          Exec=LoopGit
          Icon=loopgit
          Type=Application
          Categories=Development;Utility;
          EOF
          
          # Use our logo as icon
          cp resources/logo.png AppDir/usr/share/icons/hicolor/256x256/apps/loopgit.png
          
          # Run linuxdeploy
          ./linuxdeploy-x86_64.AppImage --appdir AppDir --plugin qt --output appimage -d AppDir/usr/share/applications/loopgit.desktop -i AppDir/usr/share/icons/hicolor/256x256/apps/loopgit.png

      - name: Upload Release Asset
        uses: softprops/action-gh-release@v1
        with:
          files: LoopGit-*.AppImage
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v3

      - name: Install Qt
        uses: jurplel/install-qt-action@v3
        with:
          version: '6.5.3'
          host: 'windows'
          target: 'desktop'
          arch: 'win64_mingw'

      - name: Build LoopGit
        run: |
          mkdir build
          cd build
          cmake -G "MinGW Makefiles" -DCMAKE_BUILD_TYPE=Release ..
          cmake --build .

      - name: Run windeployqt
        run: |
          windeployqt build/LoopGit.exe

      - name: Compile Inno Setup
        run: |
          iscc loopgit_setup.iss

      - name: Upload Release Asset
        uses: softprops/action-gh-release@v1
        with:
          files: Output/LoopGit_*_Setup.exe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
