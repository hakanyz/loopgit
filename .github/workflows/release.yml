name: Build and Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-linux:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v3

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build build-essential libgit2-dev libssl-dev libgl1-mesa-dev libfuse2

      - name: Install Qt
        uses: jurplel/install-qt-action@v3
        with:
          version: '6.5.3'
          host: 'linux'
          target: 'desktop'

      - name: Build LoopGit
        run: |
          mkdir build && cd build
          cmake -G Ninja -DCMAKE_BUILD_TYPE=Release ..
          cmake --build .

      - name: Setup AppDir for AppImage
        run: |
          mkdir -p AppDir/usr/bin
          mkdir -p AppDir/usr/share/applications
          mkdir -p AppDir/usr/share/icons/hicolor/256x256/apps
          
          # Copy the executable
          cp build/LoopGit AppDir/usr/bin/
          
          # Create a basic desktop file
          cat <<EOF > AppDir/usr/share/applications/loopgit.desktop
          [Desktop Entry]
          Name=LoopGit
          Exec=LoopGit
          Icon=loopgit
          Type=Application
          Categories=Development;Utility;
          EOF
          
          # Use our logo as icon
          cp resources/logo.png AppDir/usr/share/icons/hicolor/256x256/apps/loopgit.png
          
          # Ensure AppRun is created
          ln -s usr/bin/LoopGit AppDir/AppRun
          
      - name: Build AppImage and Tarball
        env:
          APPIMAGE_EXTRACT_AND_RUN: "1"
          QMAKE: qmake
          EXTRA_QT_PLUGINS: "svg"
        run: |
          export VERSION=${GITHUB_REF_NAME#v}
          
          # 1. Create a tar.gz fallback
          tar -czvf LoopGit-Linux-x86_64.tar.gz -C build LoopGit
          
          # 2. Download linuxdeploy and qt plugin
          wget -q https://github.com/linuxdeploy/linuxdeploy/releases/download/continuous/linuxdeploy-x86_64.AppImage
          wget -q https://github.com/linuxdeploy/linuxdeploy-plugin-qt/releases/download/continuous/linuxdeploy-plugin-qt-x86_64.AppImage
          chmod +x linuxdeploy-x86_64.AppImage linuxdeploy-plugin-qt-x86_64.AppImage
          
      - name: Build Standalone .deb Package
        run: |
          export VERSION=${GITHUB_REF_NAME#v}
          DEB_DIR="deb_package"
          
          mkdir -p ${DEB_DIR}/DEBIAN
          mkdir -p ${DEB_DIR}/opt/loopgit
          mkdir -p ${DEB_DIR}/usr/bin
          mkdir -p ${DEB_DIR}/usr/share/applications
          mkdir -p ${DEB_DIR}/usr/share/icons/hicolor/256x256/apps

          # Copy self-contained AppDir (with bundled Qt6 libraries and plugins)
          cp -r AppDir/usr/* ${DEB_DIR}/opt/loopgit/

          # Create system launcher wrapper
          cat << 'EOF' > ${DEB_DIR}/usr/bin/loopgit
          #!/bin/bash
          export LD_LIBRARY_PATH=/opt/loopgit/lib:$LD_LIBRARY_PATH
          export QT_PLUGIN_PATH=/opt/loopgit/plugins:$QT_PLUGIN_PATH
          exec /opt/loopgit/bin/LoopGit "$@"
          EOF
          chmod +x ${DEB_DIR}/usr/bin/loopgit

          # Copy desktop file and icon
          cp AppDir/usr/share/applications/loopgit.desktop ${DEB_DIR}/usr/share/applications/
          sed -i 's|Exec=LoopGit|Exec=/usr/bin/loopgit %F|g' ${DEB_DIR}/usr/share/applications/loopgit.desktop
          cp resources/logo.png ${DEB_DIR}/usr/share/icons/hicolor/256x256/apps/loopgit.png

          # Create Debian control file (self-contained, all Qt6 libraries bundled)
          cat << EOF > ${DEB_DIR}/DEBIAN/control
          Package: loopgit
          Version: ${VERSION}
          Section: devel
          Priority: optional
          Architecture: amd64
          Maintainer: Hakan <hakanyz@outlook.com>
          Depends: libc6 (>= 2.34), libstdc++6 (>= 11)
          Description: Fast, lightweight, and native Git GUI client
           LoopGit is a native desktop Git client built with C++, Qt6, and libgit2.
           Self-contained standalone package for Debian 12+, Ubuntu 22.04+, and compatible distributions.
          EOF

          # Build standalone Debian package
          dpkg-deb --build --root-owner-group ${DEB_DIR} "LoopGit-${VERSION}-Linux-x86_64.deb"
          cp "LoopGit-${VERSION}-Linux-x86_64.deb" "LoopGit_${VERSION}_amd64.deb"

      - name: Upload Release Asset
        uses: softprops/action-gh-release@v1
        with:
          files: |
            LoopGit-*.deb
            LoopGit_*.deb
            LoopGit-*.AppImage
            LoopGit-*.tar.gz
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v3

      - name: Install Qt
        uses: jurplel/install-qt-action@v3
        with:
          version: '6.5.3'
          host: 'windows'
          target: 'desktop'
          arch: 'win64_mingw'

      - name: Build LoopGit
        run: |
          mkdir build
          cd build
          cmake -G "MinGW Makefiles" -DCMAKE_BUILD_TYPE=Release ..
          cmake --build .

      - name: Run windeployqt
        run: |
          windeployqt build/LoopGit.exe

      - name: Compile Inno Setup
        run: |
          iscc loopgit_setup.iss

      - name: Upload Release Asset
        uses: softprops/action-gh-release@v1
        with:
          files: Output/LoopGit_*_Setup.exe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
