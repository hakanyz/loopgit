name: Build and Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-linux:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v3

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build build-essential libgit2-dev libssl-dev libgl1-mesa-dev libfuse2

      - name: Install Qt
        uses: jurplel/install-qt-action@v3
        with:
          version: '6.5.3'
          host: 'linux'
          target: 'desktop'

      - name: Build LoopGit
        run: |
          mkdir build && cd build
          cmake -G Ninja -DCMAKE_BUILD_TYPE=Release ..
          cmake --build .

      - name: Setup AppDir for AppImage
        run: |
          mkdir -p AppDir/usr/bin
          mkdir -p AppDir/usr/share/applications
          mkdir -p AppDir/usr/share/icons/hicolor/256x256/apps
          
          # Copy the executable
          cp build/LoopGit AppDir/usr/bin/
          
          # Create a basic desktop file
          cat <<EOF > AppDir/usr/share/applications/loopgit.desktop
          [Desktop Entry]
          Name=LoopGit
          Exec=LoopGit
          Icon=loopgit
          Type=Application
          Categories=Development;Utility;
          EOF
          
          # Use our logo as icon
          cp resources/logo.png AppDir/usr/share/icons/hicolor/256x256/apps/loopgit.png
          
          # Ensure AppRun is created
          ln -s usr/bin/LoopGit AppDir/AppRun
          
      - name: Build AppImage and Tarball
        env:
          APPIMAGE_EXTRACT_AND_RUN: "1"
          QMAKE: qmake
          EXTRA_QT_PLUGINS: "svg"
        run: |
          export VERSION=${GITHUB_REF_NAME#v}
          
          # 1. Create a tar.gz fallback
          tar -czvf LoopGit-Linux-x86_64.tar.gz -C build LoopGit
          
          # 2. Download linuxdeploy and qt plugin
          wget -q https://github.com/linuxdeploy/linuxdeploy/releases/download/continuous/linuxdeploy-x86_64.AppImage
          wget -q https://github.com/linuxdeploy/linuxdeploy-plugin-qt/releases/download/continuous/linuxdeploy-plugin-qt-x86_64.AppImage
          chmod +x linuxdeploy-x86_64.AppImage linuxdeploy-plugin-qt-x86_64.AppImage
          
          # 3. Create AppImage using modern linuxdeploy
          ./linuxdeploy-x86_64.AppImage --appdir AppDir --plugin qt --output appimage -d AppDir/usr/share/applications/loopgit.desktop -i AppDir/usr/share/icons/hicolor/256x256/apps/loopgit.png || echo "AppImage creation failed, but tar.gz is available"

      - name: Upload Release Asset
        uses: softprops/action-gh-release@v1
        with:
          files: |
            LoopGit-*.AppImage
            LoopGit-*.tar.gz
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v3

      - name: Install Qt
        uses: jurplel/install-qt-action@v3
        with:
          version: '6.5.3'
          host: 'windows'
          target: 'desktop'
          arch: 'win64_mingw'

      - name: Build LoopGit
        run: |
          mkdir build
          cd build
          cmake -G "MinGW Makefiles" -DCMAKE_BUILD_TYPE=Release ..
          cmake --build .

      - name: Run windeployqt
        run: |
          windeployqt build/LoopGit.exe

      - name: Compile Inno Setup
        run: |
          iscc loopgit_setup.iss

      - name: Upload Release Asset
        uses: softprops/action-gh-release@v1
        with:
          files: Output/LoopGit_*_Setup.exe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build-mac:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v3

      - name: Install dependencies
        run: brew install cmake ninja

      - name: Install Qt
        uses: jurplel/install-qt-action@v3
        with:
          version: '6.7.2'
          host: 'mac'
          target: 'desktop'

      - name: Build LoopGit
        run: |
          mkdir build
          cd build
          cmake -G Ninja -DCMAKE_BUILD_TYPE=Release ..
          cmake --build .

      - name: Build DMG with macdeployqt
        run: |
          macdeployqt build/LoopGit.app -dmg

      - name: Upload Release Asset
        uses: softprops/action-gh-release@v1
        with:
          files: build/LoopGit.dmg
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

